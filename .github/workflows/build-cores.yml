name: Build cores

# Builds the st and mt cores and uploads them as the ffmpeg-core /
# ffmpeg-core-mt artifacts. Reusable so CI.yml and fate.yml both get the
# cores the same way instead of duplicating the Docker build steps.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  build-core:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7
      - name: Update pkg-config database
        run: sudo ldconfig
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Expose Actions cache runtime to buildx
        uses: crazy-max/ghaction-github-runtime@v4
      - name: Build ffmpeg-core
        run: make prd EXTRA_ARGS="--cache-from=type=gha,scope=st --cache-to=type=gha,mode=max,scope=st"
      - name: Upload core
        uses: actions/upload-artifact@v7
        with:
          name: ffmpeg-core
          path: packages/core/dist/*

  build-core-mt:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Expose Actions cache runtime to buildx
        uses: crazy-max/ghaction-github-runtime@v4
      - name: Build ffmpeg-core-mt
        run: make prd-mt EXTRA_ARGS="--cache-from=type=gha,scope=mt --cache-to=type=gha,mode=max,scope=mt"
      - name: Upload core-mt
        uses: actions/upload-artifact@v7
        with:
          name: ffmpeg-core-mt
          path: packages/core-mt/dist/*
