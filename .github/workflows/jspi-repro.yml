name: JSPI hang repro

# Temporary: builds the JSPI core with function names and loops one-frame
# transcodes under a watchdog. Not a required check.
on:
  push:
    branches:
      - feat/jspi-core
  workflow_dispatch:
    inputs:
      iterations:
        type: string
        default: "60"
      procs:
        type: string
        default: "4"

concurrency:
  group: jspi-repro-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  repro:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Expose Actions cache runtime to buildx
        uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0
      - name: Keep function names in the core
        run: sed -i 's/^emcc "/emcc --profiling-funcs "/' build/ffmpeg-wasm.sh && tail -1 build/ffmpeg-wasm.sh
      - name: Build ffmpeg-core-jspi
        run: make prd-jspi EXTRA_ARGS="--cache-from=type=gha,scope=st"
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Round 1, process per iteration
        if: always()
        timeout-minutes: 12
        run: node scripts/jspi-repro.mjs --procs ${{ inputs.procs || 4 }} --iterations ${{ inputs.iterations || 60 }} --mode proc --out repro/proc
      - name: Round 2, process per iteration with tracing
        if: always()
        timeout-minutes: 12
        run: node scripts/jspi-repro.mjs --procs ${{ inputs.procs || 4 }} --iterations ${{ inputs.iterations || 60 }} --mode proc --trace --out repro/proc-trace
      - name: Round 3, one process at a time with tracing
        if: always()
        timeout-minutes: 12
        run: node scripts/jspi-repro.mjs --procs 1 --iterations ${{ inputs.iterations || 60 }} --mode proc --trace --out repro/proc1-trace
      - name: Round 4, fresh core per iteration with tracing
        if: always()
        timeout-minutes: 12
        run: node scripts/jspi-repro.mjs --procs ${{ inputs.procs || 4 }} --iterations ${{ inputs.iterations || 60 }} --mode fresh --trace --out repro/fresh-trace
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jspi-repro
          path: repro
