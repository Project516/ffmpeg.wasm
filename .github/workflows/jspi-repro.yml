name: JSPI hang repro

# Temporary: builds the JSPI core with function names and loops one-frame
# transcodes under a watchdog. Not a required check.
on:
  push:
    branches:
      - feat/jspi-core
  workflow_dispatch:
    inputs:
      iterations:
        type: string
        default: "250"
      procs:
        type: string
        default: "4"

concurrency:
  group: jspi-repro-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  repro:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Expose Actions cache runtime to buildx
        uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0
      - name: Keep function names in the core
        run: sed -i 's/^emcc "/emcc --profiling-funcs "/' build/ffmpeg-wasm.sh && tail -1 build/ffmpeg-wasm.sh
      - name: Build ffmpeg-core-jspi
        run: make prd-jspi EXTRA_ARGS="--cache-from=type=gha,scope=st"
      - name: Install gdb for hung processes
        run: sudo apt-get install -y gdb >/dev/null && sudo sysctl kernel.yama.ptrace_scope=0
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Round 1, jspi, process.exit
        if: always()
        timeout-minutes: 12
        run: node scripts/jspi-repro.mjs --procs 4 --iterations ${{ inputs.iterations || 250 }} --mode proc --out repro/jspi-exit
      - name: Round 2, jspi, no concurrent sparkplug
        if: always()
        timeout-minutes: 12
        run: node --no-concurrent-sparkplug scripts/jspi-repro.mjs --procs 4 --iterations ${{ inputs.iterations || 250 }} --mode proc --out repro/jspi-nosp
      - name: Round 3, jspi, natural exit
        if: always()
        timeout-minutes: 12
        run: node scripts/jspi-repro.mjs --procs 4 --iterations ${{ inputs.iterations || 250 }} --mode proc --exit natural --out repro/jspi-natural
      - name: Download the st core
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 37525527615 --repo "$GITHUB_REPOSITORY" -n ffmpeg-core --dir packages/core/dist
      - name: Round 4, st core on Node 24, process.exit
        if: always()
        timeout-minutes: 12
        run: node scripts/jspi-repro.mjs --procs 4 --iterations ${{ inputs.iterations || 250 }} --mode proc --core packages/core --out repro/st-exit
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jspi-repro
          path: repro
