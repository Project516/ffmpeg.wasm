name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_call:
  schedule:
    # 06:00 UTC = 00:00 CST / 01:00 CDT. Runs the full FATE subset nightly.
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      subset:
        description: "FATE subset: fast (PR-sized) or full (nightly-sized)"
        type: choice
        options:
          - fast
          - full
        default: full
      fate_only:
        description: "Comma separated test name fragments, to rerun only those"
        type: string
        default: ""
      fate_loglevel:
        description: "Value for -loglevel, to localise a hang"
        type: string
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  js:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Check docs library table matches the Dockerfile
        run: node scripts/check-doc-versions.mjs
      - name: Test the baseline comparison
        run: node --test scripts/baseline/compare.test.mjs
      - name: Check the results page matches the baseline
        run: node scripts/baseline/docs.mjs --check
      - name: Build
        run: pnpm build

  build-core:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Update pkg-config database
        run: sudo ldconfig
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Expose Actions cache runtime to buildx
        uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0
      - name: Build ffmpeg-core
        run: make prd EXTRA_ARGS="--cache-from=type=gha,scope=st --cache-to=type=gha,mode=max,scope=st"
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Check the core and record its size
        shell: bash
        run: node scripts/preset-check.mjs --core packages/core --preset full | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Upload core
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ffmpeg-core
          path: packages/core/dist/*

  build-core-mt:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Expose Actions cache runtime to buildx
        uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0
      - name: Build ffmpeg-core-mt
        run: make prd-mt EXTRA_ARGS="--cache-from=type=gha,scope=mt --cache-to=type=gha,mode=max,scope=mt"
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Check the core and record its size
        shell: bash
        run: node scripts/preset-check.mjs --core packages/core-mt --preset full | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Upload core-mt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ffmpeg-core-mt
          path: packages/core-mt/dist/*

  # Opt-in single-thread core that switches threads with JSPI instead of
  # Asyncify. Not a required check. Reads the st build cache, which already
  # holds every library and FFmpeg layer, so only the final link runs when
  # that cache exists; otherwise this is a full build.
  build-core-jspi:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    continue-on-error: true
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Expose Actions cache runtime to buildx
        uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0
      - name: Build ffmpeg-core-jspi
        run: make prd-jspi EXTRA_ARGS="--cache-from=type=gha,scope=st"
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Smoke test a transcode
        run: |
          # V8 before 13.7 needs the flag; later ones no longer list it.
          flag=$(node --v8-options | grep -o -m1 -e '--experimental-wasm-jspi' || true)
          node --version
          ls -l packages/core-jspi/dist/umd
          node $flag tests/ffmpeg-core-jspi.test.mjs
      - name: Upload core-jspi
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ffmpeg-core-jspi
          path: packages/core-jspi/dist/*

  # The smaller presets in build/presets. Each must build, contain what it
  # promises, and run a short decode and encode. The published packages
  # always ship the full preset (build-core, build-core-mt).
  build-preset:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        preset: [decode, web]
        core: [st, mt]
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Expose Actions cache runtime to buildx
        uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0
      - name: Build the ${{ matrix.preset }} preset, ${{ matrix.core }} core
        run: make ${{ matrix.core == 'mt' && 'prd-mt' || 'prd' }} PRESET=${{ matrix.preset }} EXTRA_ARGS="--cache-from=type=gha,scope=${{ matrix.core }}"
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Check the core and record its size
        shell: bash
        run: node scripts/preset-check.mjs --core packages/core${{ matrix.core == 'mt' && '-mt' || '' }} --preset ${{ matrix.preset }} | tee -a "$GITHUB_STEP_SUMMARY"

  tests:
    runs-on: ubuntu-latest
    # A core stuck in a native loop never yields to the browser, so neither
    # mocha's per-test timeout nor Ctrl-C can end the run: the page just
    # stops answering and the job would sit until GitHub's 6 hour default.
    # 20 minutes is well past the ~2 this job takes when green.
    timeout-minutes: 20
    needs:
      - js
      - build-core
      - build-core-mt
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download ffmpeg-core
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ffmpeg-core
          path: packages/core/dist
      - name: Download ffmpeg-core-mt
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ffmpeg-core-mt
          path: packages/core-mt/dist
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build packages
        run: pnpm build
      - name: Install Chrome
        id: chrome
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0
        with:
          chrome-version: stable
      - name: Run tests
        env:
          CHROME_HEADLESS: 1
          PUPPETEER_EXECUTABLE_PATH: ${{ steps.chrome.outputs.chrome-path }}
          CHROME_FLAGS: "--headless --disable-gpu --no-sandbox --enable-features=SharedArrayBuffer,CrossOriginIsolation"
        run: |
          pnpm run serve &
          sleep 5
          curl -sfI http://localhost:3000/tests/ffmpeg-st.test.html | grep -i "cross-origin-embedder-policy: require-corp"

          # One Chrome per page, all at once. Each page loads a whole core and
          # runs it, so back to back they spend most of the job with three
          # cores idle. Output is captured per page because concurrent
          # browsers interleave on stdout, then replayed in a fixed order so
          # the log still reads the same as a sequential run.
          pids=""
          for page in ffmpeg-core-st ffmpeg-st ffmpeg-mt ffmpeg-esm-fallback; do
            npx mocha-headless-chrome --args="$CHROME_FLAGS" -a no-sandbox \
              -f "http://localhost:3000/tests/$page.test.html" > "$page.log" 2>&1 &
            pids="$pids $!:$page"
          done
          failed=""
          for entry in $pids; do
            page="${entry#*:}"
            if wait "${entry%%:*}"; then status=passed; else status=FAILED; failed="$failed $page"; fi
            echo "::group::$page ($status)"
            cat "$page.log"
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then
            echo "::error::failed test pages:$failed"
            # mocha-headless-chrome reports only pass/fail, so a page that
            # wedges or fails inside a Web Worker is otherwise a black box.
            # Re-open each one and dump its console for the log. One at a time
            # would add a minute per failed page to a job that is already
            # red, so they all run at once and each writes to its own file,
            # replayed in a fixed order below for the same reason as above.
            dump_pids=""
            for page in $failed; do
              timeout 100 node scripts/dump-test-page.mjs \
                "http://localhost:3000/tests/$page.test.html" \
                > "$page.dump.log" 2>&1 &
              dump_pids="$dump_pids $!:$page"
            done
            for entry in $dump_pids; do
              page="${entry#*:}"
              wait "${entry%%:*}" || true
              echo "::group::page output: $page"
              cat "$page.dump.log"
              echo "::endgroup::"
            done
            exit 1
          fi

  # Same Mocha pages as `tests`, in Chromium, Firefox and WebKit. plain pages
  # have no COOP/COEP, so the st core runs without SharedArrayBuffer. Not a
  # required check and never fails the workflow until the results are green.
  tests-browsers:
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
        mode: [isolated, plain]
    needs:
      - js
      - build-core
      - build-core-mt
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download ffmpeg-core
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ffmpeg-core
          path: packages/core/dist
      - name: Download ffmpeg-core-mt
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ffmpeg-core-mt
          path: packages/core-mt/dist
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build packages
        run: pnpm build
      - name: Install ${{ matrix.browser }}
        run: pnpm exec playwright install --with-deps ${{ matrix.browser }}
      - name: Run tests
        run: pnpm run test:browser:playwright ${{ matrix.browser }} ${{ matrix.mode }}

  node-tests:
    runs-on: ubuntu-latest
    # Same reason as the tests job: a core spinning natively cannot be
    # interrupted, and mocha --exit only helps when it gets control back.
    timeout-minutes: 20
    needs:
      - js
      - build-core
      - build-core-mt
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download ffmpeg-core
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ffmpeg-core
          path: packages/core/dist
      - name: Download ffmpeg-core-mt
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ffmpeg-core-mt
          path: packages/core-mt/dist
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build packages
        run: pnpm build
      - name: Run tests
        run: |
          pnpm run test:node:core:st
          pnpm run test:node:core:mt
          pnpm run test:node:ffmpeg:st
          pnpm run test:node:ffmpeg:mt
          pnpm run test:node:helpers:args
          pnpm run test:node:helpers:st
          pnpm run test:node:helpers:mt

  # The wrapper tests and helpers against the experimental JSPI core, under
  # Node.js 24 and in each browser. Not required checks.
  node-tests-jspi:
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 30
    needs:
      - js
      - build-core-jspi
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download ffmpeg-core-jspi
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ffmpeg-core-jspi
          path: packages/core-jspi/dist
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build packages
        run: pnpm build
      - name: Run tests
        run: |
          # V8 before 13.7 needs the flag; later ones no longer list it.
          flag=$(node --v8-options | grep -o -m1 -e '--experimental-wasm-jspi' || true)
          status=0
          for file in ffmpeg-node ffmpeg-helpers; do
            node $flag node_modules/mocha/bin/mocha.js --exit -t 60000 \
              tests/$file.test.mjs --jspi || status=1
          done
          exit $status

  tests-jspi-browsers:
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    needs:
      - js
      - build-core-jspi
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download ffmpeg-core-jspi
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ffmpeg-core-jspi
          path: packages/core-jspi/dist
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build packages
        run: pnpm build
      - name: Install ${{ matrix.browser }}
        run: pnpm exec playwright install --with-deps ${{ matrix.browser }}
      - name: Run tests
        run: pnpm run test:browser:playwright ${{ matrix.browser }} jspi

  # FATE and benchmark jobs test the cores against FFmpeg's own FATE suite
  # and native FFmpeg. They are not required checks and never block a PR;
  # see apps/website/docs/fate-and-benchmarks.md. Idea and terminology
  # (pass/fail/skip counts, wasm/native ratio) from wasmpeg's COMPAT.md and
  # CORRECTNESS.md (https://github.com/wasmpeg/wasmpeg, LGPL-2.1-or-later).
  fate:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    needs:
      - build-core
      - build-core-mt
      - build-core-jspi
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        core: [st, mt, jspi]
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Determine subset
        id: subset
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "subset=full" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "subset=${{ inputs.subset }}" >> "$GITHUB_OUTPUT"
          else
            echo "subset=fast" >> "$GITHUB_OUTPUT"
          fi
      - name: Read pinned FFmpeg tag for the ${{ matrix.core }} core
        id: tag
        run: |
          if [ "${{ matrix.core }}" = "mt" ]; then
            tag=$(grep -oP 'FFMPEG_VERSION_MT=\K\S+' Dockerfile)
          else
            tag=$(grep -oP 'FFMPEG_VERSION_ST=\K\S+' Dockerfile)
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Download ffmpeg-core
        if: matrix.core == 'st'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ffmpeg-core
          path: packages/core/dist
      - name: Download ffmpeg-core-mt
        if: matrix.core == 'mt'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ffmpeg-core-mt
          path: packages/core-mt/dist
      - name: Download ffmpeg-core-jspi
        if: matrix.core == 'jspi'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ffmpeg-core-jspi
          path: packages/core-jspi/dist
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.core == 'jspi' && 24 || 22 }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build packages
        run: pnpm build
      - name: Cache FFmpeg's tests/ checkout
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .fate-cache/${{ steps.tag.outputs.tag }}/ffmpeg-src
          key: fate-defs-${{ steps.tag.outputs.tag }}
      - name: Fetch FATE test definitions
        run: node scripts/fate/fetch-defs.mjs --tag ${{ steps.tag.outputs.tag }}
      - name: Select subset
        run: node scripts/fate/select.mjs --tag ${{ steps.tag.outputs.tag }} --subset ${{ steps.subset.outputs.subset }} --out manifest-${{ matrix.core }}.json
      - name: Fetch samples
        run: node scripts/fate/fetch-samples.mjs --manifest manifest-${{ matrix.core }}.json --tag ${{ steps.tag.outputs.tag }}
      - name: Run FATE subset against the ${{ matrix.core }} core
        env:
          FATE_ONLY: ${{ inputs.fate_only }}
          FATE_LOGLEVEL: ${{ inputs.fate_loglevel }}
        run: |
          # V8 before 13.7 needs the flag; later ones no longer list it.
          flag=$(node --v8-options | grep -o -m1 -e '--experimental-wasm-jspi' || true)
          [ "${{ matrix.core }}" = "jspi" ] || flag=
          node $flag scripts/fate/run.mjs \
            --core packages/core${{ matrix.core == 'mt' && '-mt' || matrix.core == 'jspi' && '-jspi' || '' }} \
            --label ${{ matrix.core }} \
            --manifest manifest-${{ matrix.core }}.json \
            --out fate-results-${{ matrix.core }}.json
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fate-results-${{ matrix.core }}
          path: fate-results-${{ matrix.core }}.json

  fate-summary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: fate
    if: ${{ always() && !startsWith(github.ref, 'refs/tags/') }}
    continue-on-error: true
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Download results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: fate-results-*
          merge-multiple: true
      - name: Write step summary
        run: node scripts/fate/summary.mjs fate-results-st.json fate-results-mt.json fate-results-jspi.json >> "$GITHUB_STEP_SUMMARY"

  benchmark:
    runs-on: ubuntu-latest
    # Nightly and full-subset dispatch also run the slow 720p case.
    timeout-minutes: ${{ (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.subset == 'full')) && 75 || 30 }}
    env:
      BENCH_FLAGS: ${{ (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.subset == 'full')) && '--include-long' || '' }}
    needs:
      - build-core
      - build-core-mt
      - build-core-jspi
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    continue-on-error: true
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download ffmpeg-core
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ffmpeg-core
          path: packages/core/dist
      - name: Download ffmpeg-core-mt
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ffmpeg-core-mt
          path: packages/core-mt/dist
      # The experimental core must not fail the st and mt numbers, so its
      # steps are skipped when its artifact is missing.
      - name: Download ffmpeg-core-jspi
        id: jspi
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ffmpeg-core-jspi
          path: packages/core-jspi/dist
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build packages
        run: pnpm build
      - name: Install native FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg time
      - name: Record native FFmpeg version
        run: ffmpeg -version | head -1
      - name: Benchmark native FFmpeg
        run: node scripts/bench/run.mjs --native --out bench-native.json $BENCH_FLAGS
      - name: Benchmark st core
        run: node scripts/bench/run.mjs --core packages/core --label st --out bench-st.json $BENCH_FLAGS
      - name: Benchmark mt core
        run: node scripts/bench/run.mjs --core packages/core-mt --label mt --out bench-mt.json $BENCH_FLAGS
      # jspi needs Node.js 24, so st is run again on it for a like-for-like
      # comparison.
      - name: Setup Node.js 24
        if: steps.jspi.outcome == 'success'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Benchmark st core on Node.js 24
        id: bench-st24
        if: steps.jspi.outcome == 'success'
        continue-on-error: true
        run: node scripts/bench/run.mjs --core packages/core --label st --out bench-st-node24.json $BENCH_FLAGS
      - name: Benchmark jspi core
        id: bench-jspi
        if: steps.bench-st24.outcome == 'success'
        continue-on-error: true
        run: |
          # V8 before 13.7 needs the flag; later ones no longer list it.
          flag=$(node --v8-options | grep -o -m1 -e '--experimental-wasm-jspi' || true)
          node $flag scripts/bench/run.mjs --core packages/core-jspi --label jspi --out bench-jspi.json $BENCH_FLAGS
      - name: Combine into a ratio report
        run: node scripts/bench/report.mjs --native bench-native.json --core bench-st.json --core bench-mt.json --out bench-report.json --markdown-out bench-report.md
      - name: Compare jspi with st
        if: steps.bench-jspi.outcome == 'success'
        run: node scripts/bench/report.mjs --native bench-native.json --core bench-st-node24.json --core bench-jspi.json --out bench-report-jspi.json --markdown-out bench-report-jspi.md
      - name: Write step summary
        run: |
          {
            echo "## Benchmark results"
            echo
            cat bench-report.md
            if [ -f bench-report-jspi.md ]; then
              echo
              echo "## Benchmark results, st and jspi"
              echo
              cat bench-report-jspi.md
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bench-results
          path: bench-*.json

  # Fails when a FATE test that passed in baseline/fate.json now fails, or a
  # benchmark metric is far above baseline/bench.json. Not a required check.
  # To refresh the baseline, see "Updating the baseline" in
  # apps/website/docs/fate-and-benchmarks.md.
  baseline-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - fate
      - benchmark
    if: ${{ always() && !startsWith(github.ref, 'refs/tags/') && inputs.fate_only == '' && needs.fate.result != 'skipped' }}
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Download results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: "*-results*"
          merge-multiple: true
      - name: Compare with the baseline
        run: |
          node scripts/baseline/check.mjs \
            --fate fate-results-st.json --fate fate-results-mt.json \
            --bench bench-report.json >> "$GITHUB_STEP_SUMMARY"
