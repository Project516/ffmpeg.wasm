name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_call:
  workflow_dispatch:
    inputs:
      subset:
        description: "FATE subset: fast (PR-sized) or full"
        type: choice
        options:
          - fast
          - full
        default: full
      fate_only:
        description: "Comma separated test name fragments, to rerun only those"
        type: string
        default: ""
      fate_loglevel:
        description: "Value for -loglevel, to localise a hang"
        type: string
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Picks the jobs a change can affect. Pull requests and pushes to master are
  # diffed; other runs get every job. A path not matched below counts as core
  # and runs everything. A skipped job passes as a required check.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      build: ${{ steps.pick.outputs.build }}
      tests: ${{ steps.pick.outputs.tests }}
      fate: ${{ steps.pick.outputs.fate }}
      presets: ${{ steps.pick.outputs.presets }}
      subset: ${{ steps.pick.outputs.subset }}
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - name: Pick jobs
        id: pick
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BEFORE: ${{ github.event.before }}
          INPUT_SUBSET: ${{ inputs.subset }}
          # The wrapper, its tests and their tooling.
          JS_PATHS: '^(packages/(ffmpeg|util|types)/|tests/|testdata/|scripts/(check-doc-versions|copy-license|emit-dist-package-json|serve|test-browser|update-core-sizes)\.mjs$|package\.json$|pnpm-(lock|workspace)\.yaml$|tsconfig\.json$|eslint\.config\.mjs$|\.nvmrc$)'
          FATE_PATHS: '^(scripts/(fate|bench|baseline)/|baseline/)'
          # Only the js job, which always runs, checks these.
          DOCS_PATHS: '^(apps/|LICENSES/|\.github/(ISSUE_TEMPLATE/|SECURITY\.md$|dependabot\.yml$|workflows/(release|website)\.yml$)|[^/]+\.md$|LICENSE$|NOTICE$|\.gitignore$)'
        run: |
          core=true js=true fate=true
          base=
          if [ "$EVENT" = pull_request ]; then
            # The merge commit's first parent is the base branch.
            base=HEAD^1
          elif [ "$EVENT" = push ] && [ "$REF" = refs/heads/master ] && git fetch -q --depth=1 origin "$BEFORE"; then
            base=$BEFORE
          fi
          if [ -n "$base" ]; then
            files=$(git diff --no-renames --name-only "$base" HEAD)
            echo "$files"
            any() { printf '%s\n' "$files" | grep -E "$@" | grep -q . && echo true || echo false; }
            js=$(any "$JS_PATHS")
            fate=$(any "$FATE_PATHS")
            core=$(any -v "$JS_PATHS|$FATE_PATHS|$DOCS_PATHS")
          fi
          tests=false run_fate=false build=false
          if [ "$core" = true ] || [ "$js" = true ]; then tests=true; fi
          if [ "$core" = true ] || [ "$fate" = true ]; then run_fate=true; fi
          if [ "$tests" = true ] || [ "$run_fate" = true ]; then build=true; fi
          subset=fast
          if [ "$EVENT" = workflow_dispatch ]; then
            subset=$INPUT_SUBSET
          elif [ "$EVENT" = pull_request ] && [ "$run_fate" = true ]; then
            subset=full
          fi
          {
            echo "build=$build"
            echo "tests=$tests"
            echo "fate=$run_fate"
            echo "presets=$core"
            echo "subset=$subset"
          } | tee -a "$GITHUB_OUTPUT"

  js:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Check docs library table matches the Dockerfile
        run: node scripts/check-doc-versions.mjs
      - name: Test the baseline comparison
        run: node --test scripts/baseline/compare.test.mjs
      - name: Check the results page matches the baseline
        run: node scripts/baseline/docs.mjs --check
      - name: Build
        run: pnpm build

  build-core:
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.build == 'true' }}
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Update pkg-config database
        run: sudo ldconfig
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Expose Actions cache runtime to buildx
        uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0
      - name: Build ffmpeg-core
        run: make prd EXTRA_ARGS="--cache-from=type=gha,scope=st --cache-to=type=gha,mode=max,scope=st"
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Check the core and record its size
        shell: bash
        run: node scripts/preset-check.mjs --core packages/core --preset full | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Upload core
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ffmpeg-core
          path: packages/core/dist/*

  build-core-mt:
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.build == 'true' }}
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Expose Actions cache runtime to buildx
        uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0
      - name: Build ffmpeg-core-mt
        run: make prd-mt EXTRA_ARGS="--cache-from=type=gha,scope=mt --cache-to=type=gha,mode=max,scope=mt"
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Check the core and record its size
        shell: bash
        run: node scripts/preset-check.mjs --core packages/core-mt --preset full | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Upload core-mt
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ffmpeg-core-mt
          path: packages/core-mt/dist/*

  # Opt-in single-thread core that switches threads with JSPI instead of
  # Asyncify. Not a required check. Reads the st build cache, which already
  # holds every library and FFmpeg layer, so only the final link runs when
  # that cache exists; otherwise this is a full build.
  build-core-jspi:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: changes
    if: ${{ needs.changes.outputs.build == 'true' }}
    # Strict on tags so a release never publishes a core that failed its smoke test.
    continue-on-error: ${{ !startsWith(github.ref, 'refs/tags/') }}
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Expose Actions cache runtime to buildx
        uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0
      - name: Build ffmpeg-core-jspi
        run: make prd-jspi EXTRA_ARGS="--cache-from=type=gha,scope=st"
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Smoke test a transcode
        run: |
          # V8 before 13.7 needs the flag; later ones no longer list it.
          flag=$(node --v8-options | grep -o -m1 -e '--experimental-wasm-jspi' || true)
          node --version
          ls -l packages/core-jspi/dist/umd
          node $flag tests/ffmpeg-core-jspi.test.mjs
      - name: Upload core-jspi
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ffmpeg-core-jspi
          path: packages/core-jspi/dist/*

  # The smaller presets in build/presets. Each must build, contain what it
  # promises, and run a short decode and encode. The published packages
  # always ship the full preset (build-core, build-core-mt).
  build-preset:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: changes
    if: ${{ needs.changes.outputs.presets == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        preset: [decode, web]
        core: [st, mt]
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Expose Actions cache runtime to buildx
        uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0
      - name: Build the ${{ matrix.preset }} preset, ${{ matrix.core }} core
        run: make ${{ matrix.core == 'mt' && 'prd-mt' || 'prd' }} PRESET=${{ matrix.preset }} EXTRA_ARGS="--cache-from=type=gha,scope=${{ matrix.core }}"
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Check the core and record its size
        shell: bash
        run: node scripts/preset-check.mjs --core packages/core${{ matrix.core == 'mt' && '-mt' || '' }} --preset ${{ matrix.preset }} | tee -a "$GITHUB_STEP_SUMMARY"

  # The Mocha pages in Chromium, Firefox and WebKit. plain pages have no
  # COOP/COEP, so the st core runs without SharedArrayBuffer. Gated by `tests`.
  # A core stuck in a native loop never yields to the browser, so the timeout
  # stops the job from sitting until GitHub's 6 hour default.
  tests-browsers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
        mode: [isolated, plain]
    needs:
      - changes
      - js
      - build-core
      - build-core-mt
    if: ${{ needs.changes.outputs.tests == 'true' }}
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download ffmpeg-core
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ffmpeg-core
          path: packages/core/dist
      - name: Download ffmpeg-core-mt
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ffmpeg-core-mt
          path: packages/core-mt/dist
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build packages
        run: pnpm build
      - name: Install ${{ matrix.browser }}
        run: |
          scripts/ci-apt.sh node_modules/.bin/playwright install-deps ${{ matrix.browser }}
          pnpm exec playwright install ${{ matrix.browser }}
      - name: Run tests
        run: pnpm run test:browser:playwright ${{ matrix.browser }} ${{ matrix.mode }}

  # The required check name; a matrix job cannot be required as a whole.
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - changes
      - tests-browsers
    if: ${{ always() }}
    steps:
      - name: Require every browser job to pass
        run: |
          test "${{ needs.changes.result }}" = success
          [ "${{ needs.changes.outputs.tests }}" != true ] || test "${{ needs.tests-browsers.result }}" = success

  node-tests:
    runs-on: ubuntu-latest
    # Same reason as tests-browsers: a core spinning natively cannot be
    # interrupted, and mocha --exit only helps when it gets control back.
    timeout-minutes: 20
    needs:
      - changes
      - js
      - build-core
      - build-core-mt
    if: ${{ needs.changes.outputs.tests == 'true' }}
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download ffmpeg-core
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ffmpeg-core
          path: packages/core/dist
      - name: Download ffmpeg-core-mt
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ffmpeg-core-mt
          path: packages/core-mt/dist
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build packages
        run: pnpm build
      - name: Run tests
        run: |
          pnpm run test:node:core:st
          pnpm run test:node:core:mt
          pnpm run test:node:ffmpeg:st
          pnpm run test:node:ffmpeg:mt
          pnpm run test:node:helpers:args
          pnpm run test:node:helpers:st
          pnpm run test:node:helpers:mt

  # The wrapper tests and helpers against the experimental JSPI core, under
  # Node.js 24 and in each browser. Not required checks.
  node-tests-jspi:
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 30
    needs:
      - changes
      - js
      - build-core-jspi
    if: ${{ needs.changes.outputs.tests == 'true' }}
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download ffmpeg-core-jspi
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ffmpeg-core-jspi
          path: packages/core-jspi/dist
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build packages
        run: pnpm build
      - name: Run tests
        run: |
          # V8 before 13.7 needs the flag; later ones no longer list it.
          flag=$(node --v8-options | grep -o -m1 -e '--experimental-wasm-jspi' || true)
          status=0
          for file in ffmpeg-node ffmpeg-helpers; do
            node $flag node_modules/mocha/bin/mocha.js --exit -t 60000 \
              tests/$file.test.mjs --jspi || status=1
          done
          exit $status

  tests-jspi-browsers:
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    needs:
      - changes
      - js
      - build-core-jspi
    if: ${{ needs.changes.outputs.tests == 'true' }}
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download ffmpeg-core-jspi
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ffmpeg-core-jspi
          path: packages/core-jspi/dist
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build packages
        run: pnpm build
      - name: Install ${{ matrix.browser }}
        run: |
          scripts/ci-apt.sh node_modules/.bin/playwright install-deps ${{ matrix.browser }}
          pnpm exec playwright install ${{ matrix.browser }}
      - name: Run tests
        run: pnpm run test:browser:playwright ${{ matrix.browser }} jspi

  # FATE and benchmark jobs test the cores against FFmpeg's own FATE suite
  # and native FFmpeg. They are not required checks and never block a PR;
  # see apps/website/docs/fate-and-benchmarks.md. Idea and terminology
  # (pass/fail/skip counts, wasm/native ratio) from wasmpeg's COMPAT.md and
  # CORRECTNESS.md (https://github.com/wasmpeg/wasmpeg, LGPL-2.1-or-later).
  fate:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    needs:
      - changes
      - build-core
      - build-core-mt
      - build-core-jspi
    if: ${{ !startsWith(github.ref, 'refs/tags/') && needs.changes.outputs.fate == 'true' }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        core: [st, mt, jspi]
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read pinned FFmpeg tag for the ${{ matrix.core }} core
        id: tag
        run: |
          if [ "${{ matrix.core }}" = "mt" ]; then
            tag=$(grep -oP 'FFMPEG_VERSION_MT=\K\S+' Dockerfile)
          else
            tag=$(grep -oP 'FFMPEG_VERSION_ST=\K\S+' Dockerfile)
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Download ffmpeg-core
        if: matrix.core == 'st'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ffmpeg-core
          path: packages/core/dist
      - name: Download ffmpeg-core-mt
        if: matrix.core == 'mt'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ffmpeg-core-mt
          path: packages/core-mt/dist
      - name: Download ffmpeg-core-jspi
        if: matrix.core == 'jspi'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ffmpeg-core-jspi
          path: packages/core-jspi/dist
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.core == 'jspi' && 24 || 22 }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build packages
        run: pnpm build
      - name: Cache FFmpeg's tests/ checkout
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .fate-cache/${{ steps.tag.outputs.tag }}/ffmpeg-src
          key: fate-defs-${{ steps.tag.outputs.tag }}
      - name: Fetch FATE test definitions
        run: node scripts/fate/fetch-defs.mjs --tag ${{ steps.tag.outputs.tag }}
      - name: Select subset
        run: node scripts/fate/select.mjs --tag ${{ steps.tag.outputs.tag }} --subset ${{ needs.changes.outputs.subset }} --out manifest-${{ matrix.core }}.json
      - name: Fetch samples
        run: node scripts/fate/fetch-samples.mjs --manifest manifest-${{ matrix.core }}.json --tag ${{ steps.tag.outputs.tag }}
      - name: Run FATE subset against the ${{ matrix.core }} core
        env:
          FATE_ONLY: ${{ inputs.fate_only }}
          FATE_LOGLEVEL: ${{ inputs.fate_loglevel }}
        run: |
          # V8 before 13.7 needs the flag; later ones no longer list it.
          flag=$(node --v8-options | grep -o -m1 -e '--experimental-wasm-jspi' || true)
          [ "${{ matrix.core }}" = "jspi" ] || flag=
          node $flag scripts/fate/run.mjs \
            --core packages/core${{ matrix.core == 'mt' && '-mt' || matrix.core == 'jspi' && '-jspi' || '' }} \
            --label ${{ matrix.core }} \
            --manifest manifest-${{ matrix.core }}.json \
            --out fate-results-${{ matrix.core }}.json
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fate-results-${{ matrix.core }}
          path: fate-results-${{ matrix.core }}.json

  fate-summary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: fate
    if: ${{ always() && !startsWith(github.ref, 'refs/tags/') && needs.fate.result != 'skipped' }}
    continue-on-error: true
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Download results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: fate-results-*
          merge-multiple: true
      - name: Write step summary
        run: node scripts/fate/summary.mjs fate-results-st.json fate-results-mt.json fate-results-jspi.json >> "$GITHUB_STEP_SUMMARY"

  benchmark:
    runs-on: ubuntu-latest
    # Full-subset dispatch also runs the slow 720p case.
    timeout-minutes: ${{ (github.event_name == 'workflow_dispatch' && inputs.subset == 'full') && 75 || 30 }}
    env:
      BENCH_FLAGS: ${{ (github.event_name == 'workflow_dispatch' && inputs.subset == 'full') && '--include-long' || '' }}
    needs:
      - changes
      - build-core
      - build-core-mt
      - build-core-jspi
    if: ${{ !startsWith(github.ref, 'refs/tags/') && needs.changes.outputs.fate == 'true' }}
    continue-on-error: true
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download ffmpeg-core
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ffmpeg-core
          path: packages/core/dist
      - name: Download ffmpeg-core-mt
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ffmpeg-core-mt
          path: packages/core-mt/dist
      # The experimental core must not fail the st and mt numbers, so its
      # steps are skipped when its artifact is missing.
      - name: Download ffmpeg-core-jspi
        id: jspi
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ffmpeg-core-jspi
          path: packages/core-jspi/dist
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build packages
        run: pnpm build
      - name: Install native FFmpeg
        run: scripts/ci-apt.sh sh -c "apt-get update && apt-get install -y --no-install-recommends ffmpeg time"
      - name: Record native FFmpeg version
        run: ffmpeg -version | head -1
      - name: Benchmark native FFmpeg
        run: node scripts/bench/run.mjs --native --out bench-native.json $BENCH_FLAGS
      - name: Benchmark st core
        run: node scripts/bench/run.mjs --core packages/core --label st --out bench-st.json $BENCH_FLAGS
      - name: Benchmark mt core
        run: node scripts/bench/run.mjs --core packages/core-mt --label mt --out bench-mt.json $BENCH_FLAGS
      # jspi needs Node.js 24, so st is run again on it for a like-for-like
      # comparison.
      - name: Setup Node.js 24
        if: steps.jspi.outcome == 'success'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Benchmark st core on Node.js 24
        id: bench-st24
        if: steps.jspi.outcome == 'success'
        continue-on-error: true
        run: node scripts/bench/run.mjs --core packages/core --label st --out bench-st-node24.json $BENCH_FLAGS
      - name: Benchmark jspi core
        id: bench-jspi
        if: steps.bench-st24.outcome == 'success'
        continue-on-error: true
        run: |
          # V8 before 13.7 needs the flag; later ones no longer list it.
          flag=$(node --v8-options | grep -o -m1 -e '--experimental-wasm-jspi' || true)
          node $flag scripts/bench/run.mjs --core packages/core-jspi --label jspi --out bench-jspi.json $BENCH_FLAGS
      - name: Combine into a ratio report
        run: node scripts/bench/report.mjs --native bench-native.json --core bench-st.json --core bench-mt.json --out bench-report.json --markdown-out bench-report.md
      - name: Compare jspi with st
        if: steps.bench-jspi.outcome == 'success'
        run: node scripts/bench/report.mjs --native bench-native.json --core bench-st-node24.json --core bench-jspi.json --out bench-report-jspi.json --markdown-out bench-report-jspi.md
      - name: Write step summary
        run: |
          {
            echo "## Benchmark results"
            echo
            cat bench-report.md
            if [ -f bench-report-jspi.md ]; then
              echo
              echo "## Benchmark results, st and jspi"
              echo
              cat bench-report-jspi.md
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-results
          path: bench-*.json

  # Fails when a FATE test that passed in baseline/fate.json now fails, or a
  # benchmark metric is far above baseline/bench.json. Not a required check.
  # To refresh the baseline, see "Updating the baseline" in
  # apps/website/docs/fate-and-benchmarks.md.
  baseline-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - fate
      - benchmark
    if: ${{ always() && !startsWith(github.ref, 'refs/tags/') && inputs.fate_only == '' && needs.fate.result != 'skipped' }}
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Download results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "*-results*"
          merge-multiple: true
      - name: Compare with the baseline
        run: |
          node scripts/baseline/check.mjs \
            --fate fate-results-st.json --fate fate-results-mt.json \
            --bench bench-report.json >> "$GITHUB_STEP_SUMMARY"
