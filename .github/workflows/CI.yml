name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  js:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Check docs library table matches the Dockerfile
        run: node scripts/check-doc-versions.mjs
      - name: Build
        run: pnpm build

  build-core:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7
      - name: Update pkg-config database
        run: sudo ldconfig
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Expose Actions cache runtime to buildx
        uses: crazy-max/ghaction-github-runtime@v4
      - name: Build ffmpeg-core
        run: make prd EXTRA_ARGS="--cache-from=type=gha,scope=st --cache-to=type=gha,mode=max,scope=st"
      - name: Upload core
        uses: actions/upload-artifact@v7
        with:
          name: ffmpeg-core
          path: packages/core/dist/*

  build-core-mt:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Expose Actions cache runtime to buildx
        uses: crazy-max/ghaction-github-runtime@v4
      - name: Build ffmpeg-core-mt
        run: make prd-mt EXTRA_ARGS="--cache-from=type=gha,scope=mt --cache-to=type=gha,mode=max,scope=mt"
      - name: Upload core-mt
        uses: actions/upload-artifact@v7
        with:
          name: ffmpeg-core-mt
          path: packages/core-mt/dist/*

  tests:
    runs-on: ubuntu-latest
    needs:
      - js
      - build-core
      - build-core-mt
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7
      - name: Download ffmpeg-core
        uses: actions/download-artifact@v8
        with:
          name: ffmpeg-core
          path: packages/core/dist
      - name: Download ffmpeg-core-mt
        uses: actions/download-artifact@v8
        with:
          name: ffmpeg-core-mt
          path: packages/core-mt/dist
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build packages
        run: pnpm build
      - name: Install Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable
      - name: Run tests
        env:
          CHROME_HEADLESS: 1
          PUPPETEER_EXECUTABLE_PATH: ${{ steps.chrome.outputs.chrome-path }}
          CHROME_FLAGS: "--headless --disable-gpu --no-sandbox --enable-features=SharedArrayBuffer,CrossOriginIsolation"
        run: |
          pnpm run serve &
          sleep 5
          curl -sfI http://localhost:3000/tests/ffmpeg-st.test.html | grep -i "cross-origin-embedder-policy: require-corp"

          failed=""
          for page in ffmpeg-core-st ffmpeg-st ffmpeg-mt ffmpeg-esm-fallback; do
            echo "::group::$page"
            npx mocha-headless-chrome --args="$CHROME_FLAGS" -a no-sandbox \
              -f "http://localhost:3000/tests/$page.test.html" || failed="$failed $page"
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then
            echo "::error::failed test pages:$failed"
            # mocha-headless-chrome prints nothing from the page itself, so a
            # page that hangs or throws before mocha starts is otherwise a
            # black box. Re-open each failed page with Puppeteer directly and
            # dump its console/pageerror/worker output for the logs.
            for page in $failed; do
              echo "::group::diagnostic: $page"
              timeout 100 node scripts/diagnose-test-page.mjs "http://localhost:3000/tests/$page.test.html" || true
              echo "::endgroup::"
            done
            exit 1
          fi

  node-tests:
    runs-on: ubuntu-latest
    needs:
      - js
      - build-core
      - build-core-mt
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7
      - name: Download ffmpeg-core
        uses: actions/download-artifact@v8
        with:
          name: ffmpeg-core
          path: packages/core/dist
      - name: Download ffmpeg-core-mt
        uses: actions/download-artifact@v8
        with:
          name: ffmpeg-core-mt
          path: packages/core-mt/dist
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build packages
        run: pnpm build
      - name: Run tests
        run: |
          pnpm run test:node:core:st
          pnpm run test:node:core:mt
          pnpm run test:node:ffmpeg:st
          pnpm run test:node:ffmpeg:mt
