version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # The root pnpm workspace (packages/*). The apps/ examples are standalone
  # and excluded.
  - package-ecosystem: "npm"
    directory: "/"
    exclude-paths:
      - "apps/**"
    schedule:
      interval: "weekly"
    ignore:
      # typescript-eslint supports TypeScript below 6.1 only.
      - dependency-name: "typescript"
        versions: [">=7.0.0"]
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
