version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # The root pnpm workspace (packages/*). The apps/ examples are standalone
  # and excluded.
  - package-ecosystem: "npm"
    directory: "/"
    exclude-paths:
      - "apps/**"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
